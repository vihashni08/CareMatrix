<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareMatrix — Autonomous Multi-Agent Clinical Decision Support</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            medDark: '#090d16',
            medCard: '#0f172a',
            medCardLight: '#1e293b',
            medBorder: '#1e293b',
            medBorderLight: '#334155',
            medPrimary: '#0ea5e9',
            medAlert: '#ef4444',
            medWarning: '#f59e0b',
            medSuccess: '#10b981',
            medPurple: '#8b5cf6',
            medIndigo: '#6366f1',
            medTeal: '#14b8a6',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-medDark text-slate-100 font-sans min-h-screen antialiased selection:bg-sky-500/30">
  <div id="root"></div>

  <!-- 1. App Configuration & Utilities -->
  <script type="text/babel" src="/static/js/app/dashboardConfig.js"></script>
  <script type="text/babel" src="/static/js/utils/formatting.js"></script>
  <script type="text/babel" src="/static/js/utils/eventUtils.js"></script>

  <!-- 2. Services (REST API & Real-Time SSE) -->
  <script type="text/babel" src="/static/js/services/api.js"></script>
  <script type="text/babel" src="/static/js/services/sse.js"></script>

  <!-- 3. Central Normalized State & Reducer -->
  <script type="text/babel" src="/static/js/state/initialState.js"></script>
  <script type="text/babel" src="/static/js/state/eventReducer.js"></script>
  <script type="text/babel" src="/static/js/state/dashboardStore.js"></script>

  <!-- 4. Shared UI Components -->
  <script type="text/babel" src="/static/js/components/shared/ProvenanceBadge.jsx"></script>

  <!-- 5. Layout & Section Components -->
  <script type="text/babel" src="/static/js/components/layout/Header.jsx"></script>
  <script type="text/babel" src="/static/js/components/patient/PatientVitalsSection.jsx"></script>
  <script type="text/babel" src="/static/js/components/agents/PipelineTraceSection.jsx"></script>
  <script type="text/babel" src="/static/js/components/clinical/ClinicalReportSection.jsx"></script>
  <script type="text/babel" src="/static/js/components/clinical/CareCoordinationSection.jsx"></script>
  <script type="text/babel" src="/static/js/components/clinical/ClinicalDashboard.jsx"></script>

  <!-- 6. Primary 3 Views: Command Center, Patient Surveillance, Agent Inspection -->
  <script type="text/babel" src="/static/js/components/system/CommandCenterView.jsx"></script>
  <script type="text/babel" src="/static/js/components/patient/PatientSurveillanceView.jsx"></script>
  <script type="text/babel" src="/static/js/components/agents/AgentInspectionView.jsx"></script>

  <!-- 7. Router & Root App Entrypoint -->
  <script type="text/babel" src="/static/js/app/DashboardRouter.jsx"></script>
  <script type="text/babel" src="/static/js/app/App.jsx"></script>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.App />);
  </script>
</body>
</html>
