<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareMatrix — Autonomous Multi-Agent Clinical Decision Support</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            medDark: '#090d16',
            medCard: '#0f172a',
            medCardLight: '#1e293b',
            medBorder: '#1e293b',
            medBorderLight: '#334155',
            medPrimary: '#0ea5e9',
            medAlert: '#ef4444',
            medWarning: '#f59e0b',
            medSuccess: '#10b981',
            medPurple: '#8b5cf6',
            medIndigo: '#6366f1',
            medTeal: '#14b8a6',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .pulse-alert {
      animation: pulse-fast 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Clinical clean scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-medDark text-slate-100 font-sans min-h-screen antialiased selection:bg-sky-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Provenance Badge Component ---
    function ProvenanceBadge({ type }) {
      const badges = {
        'PATIENT_DATA': { label: 'PATIENT DATA', bg: 'bg-emerald-950/80', text: 'text-emerald-300', border: 'border-emerald-700/60' },
        'MODEL_OUTPUT': { label: 'MODEL PREDICTION', bg: 'bg-indigo-950/80', text: 'text-indigo-300', border: 'border-indigo-700/60' },
        'TEMPORAL_ANALYSIS': { label: 'TEMPORAL DRIFT', bg: 'bg-purple-950/80', text: 'text-purple-300', border: 'border-purple-700/60' },
        'AGENT_VERIFICATION': { label: 'CROSS-AGENT VERIFICATION', bg: 'bg-amber-950/80', text: 'text-amber-300', border: 'border-amber-700/60' },
        'PUBMED_RAG': { label: 'PUBMED EVIDENCE', bg: 'bg-teal-950/80', text: 'text-teal-300', border: 'border-teal-700/60' },
        'LLM_SYNTHESIS': { label: 'LLM SYNTHESIS', bg: 'bg-pink-950/80', text: 'text-pink-300', border: 'border-pink-700/60' },
        'DETERMINISTIC_SAFETY': { label: 'DETERMINISTIC SAFETY', bg: 'bg-red-950/80', text: 'text-red-300', border: 'border-red-700/60' },
      };
      const b = badges[type] || { label: type, bg: 'bg-slate-900', text: 'text-slate-300', border: 'border-slate-700' };
      return (
        <span className={`text-[10px] font-mono font-semibold px-2 py-0.5 rounded border ${b.bg} ${b.text} ${b.border}`}>
          {b.label}
        </span>
      );
    }

    // --- Main CareMatrix Application ---
    function App() {
      const [activeTab, setActiveTab] = useState('clinical'); // 'clinical' | 'research'
      const [patients, setPatients] = useState([]);
      const [selectedPid, setSelectedPid] = useState(101);
      const [patientDetail, setPatientDetail] = useState(null);
      const [clinicalReport, setClinicalReport] = useState(null);
      const [reportMetadata, setReportMetadata] = useState({});
      const [vitalsHistory, setVitalsHistory] = useState([]);
      const [activeAlerts, setActiveAlerts] = useState([]);
      const [systemHealth, setSystemHealth] = useState(null);
      const [sseConnected, setSseConnected] = useState(false);
      const [orderChecked, setOrderChecked] = useState({});
      const [expandedSections, setExpandedSections] = useState({
        clinical_status: true,
        key_findings: true,
        physiological_analysis: false,
        temporal_analysis: false,
        risk_interpretation: true,
        supporting_evidence: true,
        conflicting_evidence: true,
        evidence_synthesis: true,
        medical_evidence: true,
        clinical_interpretation: true,
        uncertainties: true,
        recommended_actions: true,
        monitoring_priorities: true,
        escalation_rationale: true,
      });

      // Research / Demo state
      const [eventStreamLogs, setEventStreamLogs] = useState([]);
      const [patientMemory, setPatientMemory] = useState(null);
      const [availableDatasets, setAvailableDatasets] = useState({ vitaldb: [] });
      const [selectedAdapter, setSelectedAdapter] = useState('vitaldb');
      const [selectedCaseId, setSelectedCaseId] = useState('');
      const [loadingDataset, setLoadingDataset] = useState(false);
      const [datasetLoadMsg, setDatasetLoadMsg] = useState('');
      const [triggeringScenario, setTriggeringScenario] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Toggle accordion section
      const toggleSection = (key) => {
        setExpandedSections(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const setAllSections = (val) => {
        const next = {};
        Object.keys(expandedSections).forEach(k => next[k] = val);
        setExpandedSections(next);
      };

      // Fetch Patient Detail & Structured Clinical Intelligence Report
      const refreshPatientDetail = async (pid) => {
        try {
          // 1. Patient full record
          const res = await fetch(`/api/patients/${pid}`);
          if (res.ok) {
            const data = await res.json();
            setPatientDetail(data);
          }

          // 2. Dedicated structured Clinical Intelligence Report
          const repRes = await fetch(`/api/patients/${pid}/clinical-report`);
          if (repRes.ok) {
            const repData = await repRes.json();
            setClinicalReport(repData.clinical_report || null);
            setReportMetadata(repData.metadata || {});
          }

          // 3. Time series vital history for waveform
          const vRes = await fetch(`/api/patients/${pid}/vitals?limit=40`);
          if (vRes.ok) {
            const vData = await vRes.json();
            setVitalsHistory(vData.vitals || []);
          }

          // 4. Episodic memory & clinician feedback
          const mRes = await fetch(`/api/patients/${pid}/memory`);
          if (mRes.ok) {
            const mData = await mRes.json();
            setPatientMemory(mData);
          }
        } catch (e) {
          console.error("Error fetching detail:", e);
        }
      };

      const refreshPatientsList = async () => {
        try {
          const res = await fetch('/api/patients');
          if (res.ok) {
            const data = await res.json();
            setPatients(data.patients || []);
          }
          const hRes = await fetch('/api/health');
          if (hRes.ok) {
            const hData = await hRes.json();
            setSystemHealth(hData);
          }
          const aRes = await fetch('/api/alerts');
          if (aRes.ok) {
            const aData = await aRes.json();
            setActiveAlerts(aData.active || []);
          }
        } catch (e) {
          console.error("Error refreshing state:", e);
        }
      };

      const fetchDatasets = async () => {
        try {
          const res = await fetch('/api/datasets');
          if (res.ok) {
            const data = await res.json();
            setAvailableDatasets(data);
            const cases = data.vitaldb || [];
            if (cases.length > 0 && !selectedCaseId) setSelectedCaseId(String(cases[0]));
          }
        } catch (e) {
          console.error("Error fetching datasets:", e);
        }
      };

      useEffect(() => {
        refreshPatientsList();
        refreshPatientDetail(selectedPid);
        fetchDatasets();
      }, [selectedPid]);

      // Connect to Server-Sent Events (SSE) stream
      useEffect(() => {
        const es = new EventSource('/api/events/stream');

        es.onopen = () => setSseConnected(true);
        es.onerror = () => setSseConnected(false);

        es.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            const now = new Date().toLocaleTimeString();

            // Log event in research console
            setEventStreamLogs(prev => [
              { time: now, type: msg.type, data: msg.data },
              ...prev.slice(0, 49)
            ]);

            if (msg.type === 'vital_tick') {
              const obs = msg.data;
              const pid = obs.patient_id || obs.case_id;

              setPatients(prev => prev.map(p => {
                if (p.patient_id === pid) {
                  return { ...p, latest_vitals: obs, last_updated: Date.now() / 1000 };
                }
                return p;
              }));

              if (pid === selectedPid) {
                setPatientDetail(prev => prev ? { ...prev, latest_vitals: obs } : prev);
                setVitalsHistory(prev => {
                  const updated = [...prev, obs];
                  return updated.slice(-40);
                });
              }
            } else if (msg.type === 'clinical_reasoning' || msg.type === 'care_coordination' || msg.type === 'data_analysis' || msg.type === 'risk_prediction') {
              refreshPatientDetail(selectedPid);
              refreshPatientsList();
            } else if (msg.type === 'alert_updated' || msg.type === 'monitoring_alert') {
              refreshPatientsList();
              refreshPatientDetail(selectedPid);
            }
          } catch (e) {
            console.error("SSE parse error:", e);
          }
        };

        const interval = setInterval(refreshPatientsList, 4000);
        return () => {
          es.close();
          clearInterval(interval);
        };
      }, [selectedPid]);

      // Render Physiological Waveform with Chart.js
      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');

        const labels = vitalsHistory.map((_, i) => `${i + 1}s`);
        const hrData = vitalsHistory.map(v => v.hr || v.HR || 0);
        const mapData = vitalsHistory.map(v => v.map || v.MAP || 0);
        const spo2Data = vitalsHistory.map(v => v.spo2 || v.SpO2 || 0);

        if (!chartInstance.current) {
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels,
              datasets: [
                {
                  label: 'Heart Rate (BPM)',
                  data: hrData,
                  borderColor: '#ef4444',
                  backgroundColor: 'rgba(239, 68, 68, 0.08)',
                  borderWidth: 2,
                  tension: 0.35,
                  pointRadius: 2,
                  yAxisID: 'yHR',
                },
                {
                  label: 'Mean Arterial Pressure (mmHg)',
                  data: mapData,
                  borderColor: '#0ea5e9',
                  backgroundColor: 'rgba(14, 165, 233, 0.08)',
                  borderWidth: 2,
                  tension: 0.35,
                  pointRadius: 2,
                  yAxisID: 'yMAP',
                },
                {
                  label: 'Oxygen Saturation SpO2 (%)',
                  data: spo2Data,
                  borderColor: '#10b981',
                  backgroundColor: 'rgba(16, 185, 129, 0.08)',
                  borderWidth: 2,
                  tension: 0.35,
                  pointRadius: 2,
                  yAxisID: 'ySpO2',
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: false,
              scales: {
                x: {
                  grid: { color: '#1e293b' },
                  ticks: { color: '#64748b', font: { size: 10 } }
                },
                yHR: {
                  type: 'linear',
                  position: 'left',
                  min: 40,
                  max: 160,
                  grid: { color: '#1e293b' },
                  ticks: { color: '#ef4444', font: { size: 10 } },
                  title: { display: true, text: 'HR (BPM)', color: '#ef4444', font: { size: 10, weight: 'bold' } }
                },
                yMAP: {
                  type: 'linear',
                  position: 'right',
                  min: 40,
                  max: 130,
                  grid: { drawOnChartArea: false },
                  ticks: { color: '#0ea5e9', font: { size: 10 } },
                  title: { display: true, text: 'MAP (mmHg)', color: '#0ea5e9', font: { size: 10, weight: 'bold' } }
                },
                ySpO2: {
                  type: 'linear',
                  position: 'right',
                  min: 80,
                  max: 102,
                  grid: { drawOnChartArea: false },
                  ticks: { color: '#10b981', font: { size: 10 } },
                  display: false,
                }
              },
              plugins: {
                legend: {
                  labels: { color: '#cbd5e1', font: { size: 11 } }
                }
              }
            }
          });
        } else {
          chartInstance.current.data.labels = labels;
          chartInstance.current.data.datasets[0].data = hrData;
          chartInstance.current.data.datasets[1].data = mapData;
          chartInstance.current.data.datasets[2].data = spo2Data;
          chartInstance.current.update('none');
        }
      }, [vitalsHistory]);

      // Alert actions
      const handleAcknowledgeAlert = async (alertId) => {
        try {
          const res = await fetch(`/api/alerts/${alertId}/acknowledge`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clinician_id: "Attending Physician" })
          });
          if (res.ok) {
            refreshPatientsList();
            refreshPatientDetail(selectedPid);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleResolveAlert = async (alertId) => {
        try {
          const res = await fetch(`/api/alerts/${alertId}/resolve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: "Bedside evaluation complete; patient stable under monitoring." })
          });
          if (res.ok) {
            refreshPatientsList();
            refreshPatientDetail(selectedPid);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Research/Demo actions
      const handleTriggerScenario = async (scenario) => {
        setTriggeringScenario(true);
        try {
          await fetch('/api/scenarios/trigger', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patient_id: selectedPid, scenario })
          });
          setTimeout(() => {
            refreshPatientDetail(selectedPid);
            refreshPatientsList();
            setTriggeringScenario(false);
          }, 350);
        } catch (e) {
          console.error(e);
          setTriggeringScenario(false);
        }
      };

      const handleLoadDatasetPatient = async () => {
        if (!selectedCaseId) return;
        setLoadingDataset(true);
        setDatasetLoadMsg('');
        try {
          const res = await fetch('/api/patients/dataset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ case_id: parseInt(selectedCaseId, 10) || selectedCaseId, adapter: selectedAdapter })
          });
          if (res.ok) {
            const data = await res.json();
            setDatasetLoadMsg(`✓ Loaded ${data.data_source || 'patient'} as Bed ${data.patient_id}`);
            setTimeout(() => {
              refreshPatientsList();
              setDatasetLoadMsg('');
            }, 2500);
          } else {
            const err = await res.json();
            setDatasetLoadMsg(`Error: ${err.error || 'Failed to load case'}`);
          }
        } catch (e) {
          setDatasetLoadMsg('Network error loading dataset case');
          console.error(e);
        } finally {
          setLoadingDataset(false);
        }
      };

      // Active patient contextual variables
      const activePatient = patients.find(p => p.patient_id === selectedPid) || {};
      const vitals = patientDetail?.latest_vitals || activePatient?.latest_vitals || {};
      const careAction = patientDetail?.latest_care_action;
      const riskDecision = patientDetail?.latest_risk_decision;
      const riskModelName = riskDecision?.model_name || patientDetail?.risk_model_name ||
        activePatient?.risk_model_name || systemHealth?.risk_model_name || 'Model loading';
      const riskModelLabel = riskModelName.replace(/([a-z])([A-Z])/g, '$1 $2');
      const dataAnalysis = patientDetail?.latest_data_analysis;
      const clinicalReasoning = patientDetail?.latest_clinical_reasoning;
      const monitoringEvent = patientDetail?.latest_monitoring_event;

      // Extract Clinical Report fields with fallback
      const rep = clinicalReport || (clinicalReasoning?.clinical_report) || {};
      const reportStatus = rep.clinical_status || {
        risk_level: clinicalReasoning?.risk_level || riskDecision?.risk_level || 'LOW RISK',
        priority: clinicalReasoning?.priority || 'ROUTINE',
        confidence: clinicalReasoning?.confidence || 0.95,
        data_reliability: clinicalReasoning?.data_reliability || 'HIGH',
        evidence_consistency: clinicalReasoning?.evidence_consistency || 'SUPPORTING',
      };

      const isHighRisk = (reportStatus.risk_level || '').includes('HIGH');
      const isUrgent = reportStatus.priority === 'URGENT' || activePatient?.status === 'ALERT';
      const isElevated = reportStatus.priority === 'ELEVATED' || activePatient?.status === 'SURVEILLANCE';
      const isDataCompromised = reportStatus.data_reliability === 'COMPROMISED';
      const isConflicting = reportStatus.evidence_consistency === 'CONFLICTING';

      // Adaptive execution status determination
      const isAdaptiveRAGSkipped = reportMetadata?.evidence_retrieval === 'SKIPPED_LOW_RISK_CONFIDENT' ||
        (clinicalReasoning?.metadata?.evidence_retrieval === 'SKIPPED_LOW_RISK_CONFIDENT') ||
        (rep?.medical_evidence && rep.medical_evidence.length === 0 && !isHighRisk);
      const isSafetyArbitrated = reportMetadata?.safety_arbitration_applied ||
        (clinicalReasoning?.metadata?.safety_arbitration_applied) ||
        (rep?.executive_summary || '').startsWith('[SAFETY ARBITRATION]') ||
        (rep?.conflicting_evidence || []).some(c => typeof c === 'string' && c.includes('[SAFETY ARBITRATION]'));

      return (
        <div className="flex flex-col min-h-screen">
          {/* ================================================================= */}
          {/* 1. TOP HEADER & WORKSPACE NAVIGATION                              */}
          {/* ================================================================= */}
          <header className="bg-medCard border-b border-medBorder px-6 py-3 flex items-center justify-between shadow-xl sticky top-0 z-50">
            <div className="flex items-center space-x-4">
              <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-sky-500/20 text-base">
                CM
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2.5">
                  CAREMATRIX
                  <span className="text-xs font-semibold text-sky-400 bg-sky-950/70 border border-sky-800 px-2.5 py-0.5 rounded-full">
                    Clinical Decision Support Platform
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Cooperating Multi-Agent Surveillance & Evidence-Grounded Reasoning</p>
              </div>
            </div>

            {/* View Switcher Tabs (Clinical CDS vs Research Demo) */}
            <div className="flex items-center bg-medDark border border-medBorder rounded-xl p-1 shadow-inner">
              <button
                onClick={() => setActiveTab('clinical')}
                className={`flex items-center space-x-2 px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                  activeTab === 'clinical'
                    ? 'bg-sky-600 text-white shadow-md shadow-sky-600/30'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
              >
                <span>Clinical Decision Support</span>
              </button>
              <button
                onClick={() => setActiveTab('research')}
                className={`flex items-center space-x-2 px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                  activeTab === 'research'
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
              >
                <span>Research & System Evaluation</span>
              </button>
            </div>

            {/* Live Status Indicators */}
            <div className="flex items-center space-x-3">
              <div className="flex items-center space-x-2 bg-medDark px-3 py-1.5 rounded-lg border border-medBorder text-xs">
                <span className={`h-2.5 w-2.5 rounded-full ${sseConnected ? 'bg-emerald-400 animate-ping' : 'bg-red-500'}`}></span>
                <span className="text-slate-300 font-medium">SSE Stream:</span>
                <span className={`font-semibold ${sseConnected ? 'text-emerald-400' : 'text-red-400'}`}>
                  {sseConnected ? 'LIVE' : 'POLLING'}
                </span>
              </div>

              <div className={`text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-2 border ${
                activeAlerts.length > 0
                  ? 'bg-red-950/70 text-red-300 border-red-700/80 pulse-alert shadow-lg shadow-red-900/20'
                  : 'bg-emerald-950/40 text-emerald-300 border-emerald-800/60'
              }`}>
                <span className={`h-2 w-2 rounded-full ${activeAlerts.length > 0 ? 'bg-red-400' : 'bg-emerald-400'}`}></span>
                {activeAlerts.length} Active Alert{activeAlerts.length === 1 ? '' : 's'}
              </div>
            </div>
          </header>

          {/* ================================================================= */}
          {/* 2. MONITORED BEDS / PATIENT SELECTION STRIP                        */}
          {/* ================================================================= */}
          <section className="bg-slate-900/95 border-b border-medBorder px-6 py-2 flex items-center space-x-3 overflow-x-auto">
            <span className="text-xs font-bold text-slate-400 uppercase tracking-wider pr-1">Beds:</span>
            {patients.map(p => {
              const isSelected = p.patient_id === selectedPid;
              const hasAlert = p.has_active_alert || p.status === 'ALERT';
              const isSurveillance = p.status === 'SURVEILLANCE';
              return (
                <button
                  key={p.patient_id}
                  onClick={() => setSelectedPid(p.patient_id)}
                  className={`flex items-center space-x-3 px-3.5 py-1.5 rounded-lg border text-left transition-all ${
                    isSelected
                      ? 'bg-medCard border-sky-500 shadow-md shadow-sky-500/20 ring-1 ring-sky-500/50'
                      : 'bg-medDark/60 border-medBorder hover:border-slate-700'
                  }`}
                >
                  <div className="flex flex-col">
                    <div className="flex items-center space-x-2">
                      <span className="text-xs font-bold text-white">{p.name || `Bed ${p.patient_id}`}</span>
                      <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-tight ${
                        hasAlert ? 'bg-red-500 text-white animate-pulse' :
                        isSurveillance ? 'bg-amber-500 text-black' :
                        'bg-emerald-600/30 text-emerald-300 border border-emerald-500/40'
                      }`}>
                        {p.status}
                      </span>
                    </div>
                    <div className="flex items-center space-x-2 text-[11px] text-slate-400 mt-0.5">
                      <span>HR: <b className="text-slate-100">{Math.round(p.latest_vitals?.hr || p.latest_vitals?.HR || 0)}</b></span>
                      <span>MAP: <b className="text-slate-100">{Math.round(p.latest_vitals?.map || p.latest_vitals?.MAP || 0)}</b></span>
                      <span className="text-slate-500">• {p.scenario || 'STABLE'}</span>
                    </div>
                    {(p.data_source && p.data_source !== 'simulated') ? (
                      <span className="text-[9px] mt-0.5 px-1.5 py-0.2 rounded bg-teal-950 text-teal-300 border border-teal-800 font-mono self-start">
                        {p.data_source.toUpperCase()}
                      </span>
                    ) : (
                      <span className="text-[9px] mt-0.5 px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 border border-slate-700 font-mono self-start">
                        SIMULATED
                      </span>
                    )}
                  </div>
                </button>
              );
            })}
          </section>

          {/* ================================================================= */}
          {/* 3. MAIN WORKSPACE VIEW (CLINICAL CDS vs RESEARCH DEMO)            */}
          {/* ================================================================= */}
          {activeTab === 'clinical' ? (
            <main className="flex-1 p-6 space-y-6 max-w-7xl mx-auto w-full">

              {/* SECTION A — PATIENT OVERVIEW BANNER */}
              <div className="bg-medCard border border-medBorder rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center space-x-3">

                  <div className="flex items-center justify-between border-b border-medBorder pb-3">
                    <div>
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        Care Coordination Action Plan
                        <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase ${
                          isUrgent ? 'bg-red-500 text-white' :
                          isElevated ? 'bg-amber-500 text-black' :
                          'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                        }`}>
                          Priority: {careAction?.priority || 'ROUTINE'}
                        </span>
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Deterministic bedside tasking & decision support workflow translation (Clinical Decision Support Only)
                      </p>
                    </div>

                    {careAction?.clinician_review_required && (
                      <span className="text-xs bg-red-950/80 border border-red-700 text-red-300 px-2.5 py-1 rounded-md font-semibold flex items-center gap-1.5">
                        <span className="h-2 w-2 rounded-full bg-red-400 animate-ping"></span>
                        Clinician Review Required
                      </span>
                    )}
                  </div>

                  {/* Escalation Pathway Banner */}
                  <div className="bg-slate-900/90 border border-slate-800 rounded-lg p-3">
                    <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                      Assigned Hospital Escalation Pathway:
                    </div>
                    <div className="text-xs font-bold text-sky-400 mt-0.5">
                      {careAction?.escalation_pathway || 'Standard Continuous Floor Surveillance Protocol'}
                    </div>
                    <div className="text-xs text-slate-300 mt-1 italic">
                      Clinical Reason: {careAction?.reason || 'Vitals and analytical trend indicators within normal limits.'}
                    </div>
                  </div>

                  {/* Suggested Actionable Orders Checklist */}
                  <div>
                    <div className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                      <span>Recommended Clinician Review & Decision Support Checklist:</span>
                      <span className="text-[10px] text-slate-500 font-mono">Requires Bedside Clinician Verification</span>
                    </div>
                    <div className="space-y-1.5">
                      {(careAction?.suggested_orders && careAction.suggested_orders.length > 0) ? (
                        careAction.suggested_orders.map((ord, idx) => {
                          const isChecked = orderChecked[`${selectedPid}_${idx}`];
                          return (
                            <label
                              key={idx}
                              className={`flex items-start space-x-2.5 p-2.5 rounded-lg border text-xs cursor-pointer transition ${
                                isChecked
                                  ? 'bg-emerald-950/20 border-emerald-800/40 text-slate-400 line-through'
                                  : 'bg-slate-900/80 border-medBorder hover:border-slate-700 text-slate-200'
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={!!isChecked}
                                onChange={(e) => setOrderChecked(prev => ({
                                  ...prev,
                                  [`${selectedPid}_${idx}`]: e.target.checked
                                }))}
                                className="mt-0.5 rounded border-slate-700 bg-slate-800 text-sky-500 focus:ring-sky-500"
                              />
                              <span className="flex-1">{ord}</span>
                            </label>
                          );
                        })
                      ) : (
                        <div className="text-xs text-slate-400 p-3 bg-slate-900 rounded-lg border border-slate-800">
                          Maintain continuous standard observation. No active clinical order escalation required.
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* Right: Clinical Alert Center & Lifecycle Timeline (5 cols) */}
                <div className="lg:col-span-5 bg-medCard border border-medBorder rounded-xl p-5 space-y-4 flex flex-col justify-between shadow-xl">
                  <div>
                    <div className="flex items-center justify-between border-b border-medBorder pb-3">
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        Clinical Alert Center
                        <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                          Bed {selectedPid}
                        </span>
                      </h3>
                      <span className="text-[10px] text-slate-400 font-mono">NEW → ACTIVE → ACK → RESOLVED</span>
                    </div>

                    {/* Active Alerts for this patient */}
                    <div className="mt-3 space-y-2">
                      {patientDetail?.active_alerts && patientDetail.active_alerts.length > 0 ? (
                        patientDetail.active_alerts.map(al => (
                          <div
                            key={al.alert_id}
                            className={`p-3.5 rounded-lg border flex flex-col space-y-2 ${
                              al.state === 'NEW' ? 'bg-red-950/50 border-red-700 text-red-100' :
                              al.state === 'ACTIVE' ? 'bg-amber-950/40 border-amber-700 text-amber-100' :
                              'bg-slate-900 border-slate-700 text-slate-300'
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded uppercase ${
                                al.state === 'NEW' ? 'bg-red-600 text-white animate-pulse' :
                                al.state === 'ACTIVE' ? 'bg-amber-600 text-black' :
                                'bg-sky-600 text-white'
                              }`}>
                                [{al.state}] {al.severity}
                              </span>
                              <span className="text-[11px] text-slate-400 font-mono">
                                Active Duration: {al.duration_seconds}s
                              </span>
                            </div>

                            <div className="text-xs">
                              <span className="font-semibold text-white">Breached Signals: </span>
                              <span className="text-red-300 font-mono">{al.affected_vitals?.join(', ')}</span>
                            </div>

                            {al.acknowledged_by ? (
                              <div className="text-[11px] text-emerald-400 font-medium">
                                ✓ Acknowledged by {al.acknowledged_by}
                              </div>
                            ) : (
                              <div className="flex items-center space-x-2 pt-1">
                                <button
                                  onClick={() => handleAcknowledgeAlert(al.alert_id)}
                                  className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-1.5 px-3 rounded text-xs transition shadow"
                                >
                                  Acknowledge Alert (Clinician Review)
                                </button>
                                <button
                                  onClick={() => handleResolveAlert(al.alert_id)}
                                  className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-1.5 px-3 rounded text-xs transition"
                                >
                                  Resolve Alert
                                </button>
                              </div>
                            )}
                          </div>
                        ))
                      ) : (
                        <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-lg text-center text-xs text-slate-400">
                          <span className="text-emerald-400 font-semibold block mb-1">✓ No Active Clinical Alerts</span>
                          Vital parameters are within tolerated boundaries.
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Compact Lifecycle Progression Banner */}
                  <div className="bg-slate-950/80 p-3 rounded-lg border border-slate-800 text-[11px] text-slate-400">
                    <div className="font-semibold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">
                      Alert Progression Lifecycle:
                    </div>
                    <div className="flex items-center justify-between text-[10px] font-mono text-slate-400">
                      <span className="text-sky-400 font-bold">1. Observation</span>
                      <span>→</span>
                      <span className="text-indigo-400 font-bold">2. Detection</span>
                      <span>→</span>
                      <span className="text-purple-400 font-bold">3. Risk Check</span>
                      <span>→</span>
                      <span className="text-amber-400 font-bold">4. Verification</span>
                      <span>→</span>
                      <span className="text-pink-400 font-bold">5. Clinical Report</span>
                    </div>
                  </div>
                </div>
              </div>

            </main>
          ) : (
            /* =============================================================== */
            /* TAB 2: RESEARCH & SYSTEM DEMONSTRATION VIEW                     */
            /* =============================================================== */
            <main className="flex-1 p-6 space-y-6 max-w-7xl mx-auto w-full">
              {/* Research View Header Banner */}
              <div className="bg-gradient-to-r from-indigo-950/60 via-slate-900 to-purple-950/60 border border-indigo-700/60 rounded-2xl p-5 shadow-xl">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-xl font-black text-white tracking-tight flex items-center gap-2">
                      Research, Evaluation & Diagnostic Controls
                      <span className="text-xs font-mono font-normal text-indigo-300 px-2.5 py-0.5 rounded-full bg-indigo-950 border border-indigo-800">
                        Examiner & Demo Sandbox
                      </span>
                    </h2>
                    <p className="text-xs text-slate-300 mt-1">
                      Separated evaluation environment for real dataset loading, fault injection, live event logs, and latency monitoring.
                    </p>
                  </div>
                  <button
                    onClick={() => setActiveTab('clinical')}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 font-bold px-3 py-1.5 rounded-lg transition self-start sm:self-auto"
                  >
                    ← Return to Clinical CDS View
                  </button>
                </div>
              </div>

              {/* Research Grid: Dataset Loader & Synthetic Scenarios */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                {/* 1. Real Dataset Patient Loader */}
                <div className="bg-medCard border border-teal-800/60 rounded-xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between border-b border-medBorder pb-3">
                      <div>
                        <h3 className="text-sm font-bold text-teal-300">Real Clinical Dataset Loader</h3>
                        <p className="text-xs text-slate-400 mt-0.5">Stream authentic physiological recordings into the multi-agent pipeline</p>
                      </div>
                      <span className="text-[10px] font-mono bg-teal-950 text-teal-400 border border-teal-800 px-2 py-0.5 rounded">
                        VitalDB
                      </span>
                    </div>

                    <div className="mt-4 space-y-3">
                      <div>
                        <label className="text-xs font-semibold text-slate-300 block mb-1">Select Cohort Adapter:</label>
                        <select
                          value={selectedAdapter}
                          onChange={(e) => {
                            setSelectedAdapter(e.target.value);
                            const cases = availableDatasets[e.target.value] || [];
                            setSelectedCaseId(cases.length > 0 ? String(cases[0]) : '');
                          }}
                          className="w-full text-xs bg-slate-900 border border-slate-700 text-slate-200 py-2 px-3 rounded-lg"
                        >
                          <option value="vitaldb">VitalDB Surgical ICU Cohort (High-frequency physiological recordings)</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-slate-300 block mb-1">Select Verified Case ID:</label>
                        <select
                          value={selectedCaseId}
                          onChange={(e) => setSelectedCaseId(e.target.value)}
                          className="w-full text-xs bg-slate-900 border border-slate-700 text-slate-200 py-2 px-3 rounded-lg font-mono"
                        >
                          {(availableDatasets[selectedAdapter] || []).map(cid => (
                            <option key={cid} value={String(cid)}>Case #{cid}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-medBorder">
                    <button
                      disabled={loadingDataset || !selectedCaseId}
                      onClick={handleLoadDatasetPatient}
                      className="w-full text-xs bg-teal-800 hover:bg-teal-700 border border-teal-600 py-2.5 px-4 rounded-lg font-bold text-white transition disabled:opacity-50 shadow"
                    >
                      {loadingDataset ? 'Loading Case Telemetry into Pipeline...' : `Load Case #${selectedCaseId} into Live Surveillance`}
                    </button>
                    {datasetLoadMsg && (
                      <p className={`text-xs mt-2 font-medium ${datasetLoadMsg.startsWith('✓') ? 'text-teal-400' : 'text-red-400'}`}>
                        {datasetLoadMsg}
                      </p>
                    )}
                  </div>
                </div>

                {/* 2. Synthetic Fault Injection Sandbox (Demo Only) */}
                <div className="bg-medCard border border-medBorder rounded-xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between border-b border-medBorder pb-3">
                      <div>
                        <h3 className="text-sm font-bold text-amber-300">Fault Injection & Simulation Sandbox</h3>
                        <p className="text-xs text-slate-400 mt-0.5">Test deterministic safety arbitration and sensor anomaly detection</p>
                      </div>
                      <span className="text-[10px] font-mono bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded">
                        Testing Only
                      </span>
                    </div>

                    <div className="mt-3 text-xs text-slate-300">
                      Currently testing: <b className="text-white">Bed {selectedPid} ({activePatient?.scenario || 'STABLE'})</b>
                    </div>

                    <div className="grid grid-cols-2 gap-2 mt-3">
                      <button
                        disabled={triggeringScenario}
                        onClick={() => handleTriggerScenario('STABLE')}
                        className="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 py-2 px-3 rounded-lg font-medium text-slate-200 transition"
                      >
                        Stable Baseline
                      </button>
                      <button
                        disabled={triggeringScenario}
                        onClick={() => handleTriggerScenario('GRADUAL_DETERIORATION')}
                        className="text-xs bg-red-950/70 hover:bg-red-900 border border-red-800 py-2 px-3 rounded-lg font-medium text-red-300 transition"
                      >
                        Sepsis Deterioration
                      </button>
                      <button
                        disabled={triggeringScenario}
                        onClick={() => handleTriggerScenario('SUDDEN_ABNORMALITY')}
                        className="text-xs bg-purple-950/70 hover:bg-purple-900 border border-purple-800 py-2 px-3 rounded-lg font-medium text-purple-300 transition"
                      >
                        Sudden Hemodynamic Shock
                      </button>
                      <button
                        disabled={triggeringScenario}
                        onClick={() => handleTriggerScenario('RECOVERY')}
                        className="text-xs bg-emerald-950/70 hover:bg-emerald-900 border border-emerald-800 py-2 px-3 rounded-lg font-medium text-emerald-300 transition"
                      >
                        Post-Intervention Recovery
                      </button>
                      <button
                        disabled={triggeringScenario}
                        onClick={() => handleTriggerScenario('NOISY_SENSOR')}
                        className="text-xs bg-amber-950/70 hover:bg-amber-900 border border-amber-800 py-2 px-3 rounded-lg font-medium text-amber-300 transition"
                      >
                        Sensor Noise Artifact
                      </button>
                      <button
                        disabled={triggeringScenario}
                        onClick={() => handleTriggerScenario('MISSING_DATA')}
                        className="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 py-2 px-3 rounded-lg font-medium text-slate-400 transition"
                      >
                        Missing Telemetry Lead
                      </button>
                    </div>
                  </div>

                  <div className="text-[11px] text-slate-400 border-t border-medBorder pt-3 mt-4">
                    Note: Fault injection modifies synthetic telemetry streams to demonstrate cross-agent arbitration and data reliability gating.
                  </div>
                </div>

              </div>

              {/* Research Metrics & System Event Log */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* System Metrics & Adaptive Execution Stats (5 cols) */}
                <div className="lg:col-span-5 bg-medCard border border-medBorder rounded-xl p-5 space-y-4 shadow-xl">
                  <h3 className="text-sm font-bold text-white border-b border-medBorder pb-3">
                    Adaptive Pipeline Runtime Metrics
                  </h3>
                  <div className="space-y-2.5 text-xs">
                    <div className="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                      <span className="text-slate-400">Total Telemetry Observations:</span>
                      <span className="font-mono font-bold text-white">{systemHealth?.runtime_metrics?.total_observations_evaluated || 0}</span>
                    </div>
                    <div className="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                      <span className="text-slate-400">Adaptive Gated Bypasses:</span>
                      <span className="font-mono font-bold text-sky-400">{systemHealth?.runtime_metrics?.routine_bypassed_cycles || 0}</span>
                    </div>
                    <div className="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                      <span className="text-slate-400">Supervisor Status:</span>
                      <span className="font-mono font-bold text-emerald-400">
                        {systemHealth?.all_healthy ? "ALL 5 AGENTS HEALTHY" : "DEGRADED"}
                      </span>
                    </div>
                    <div className="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                      <span className="text-slate-400">Live SSE Subscribers:</span>
                      <span className="font-mono font-bold text-purple-400">1 Client Connected</span>
                    </div>
                  </div>
                </div>

                {/* Real-time SSE Stream Terminal (7 cols) */}
                <div className="lg:col-span-7 bg-medCard border border-medBorder rounded-xl p-5 shadow-xl flex flex-col justify-between">
                  <div className="flex items-center justify-between border-b border-medBorder pb-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      Live Multi-Agent Event Bus
                      <span className="text-[10px] font-mono bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded">
                        /api/events/stream
                      </span>
                    </h3>
                    <button
                      onClick={() => setEventStreamLogs([])}
                      className="text-[10px] text-slate-400 hover:text-slate-200"
                    >
                      Clear Log
                    </button>
                  </div>

                  <div className="mt-3 bg-medDark rounded-lg p-3 border border-slate-800 font-mono text-[11px] h-64 overflow-y-auto space-y-1">
                    {eventStreamLogs.length > 0 ? (
                      eventStreamLogs.map((log, idx) => (
                        <div key={idx} className="flex items-start space-x-2">
                          <span className="text-slate-500">[{log.time}]</span>
                          <span className={`font-semibold ${
                            log.type === 'clinical_reasoning' ? 'text-pink-400' :
                            log.type === 'care_coordination' ? 'text-emerald-400' :
                            log.type === 'risk_prediction' ? 'text-indigo-400' :
                            log.type === 'data_analysis' ? 'text-purple-400' :
                            log.type === 'monitoring_alert' ? 'text-red-400' :
                            'text-sky-400'
                          }`}>
                            {log.type}
                          </span>
                          <span className="text-slate-300 truncate flex-1">
                            {JSON.stringify(log.data).slice(0, 80)}...
                          </span>
                        </div>
                      ))
                    ) : (
                      <div className="text-slate-500 italic text-center py-10">
                        Listening for multi-agent events on Server-Sent Events stream...
                      </div>
                    )}
                  </div>
                </div>

                {/* 3. Episodic Patient Memory & Clinician Feedback Inspector (12 cols) */}
                <div className="lg:col-span-12 bg-medCard border border-medBorder rounded-xl p-5 shadow-xl space-y-3">
                  <div className="flex items-center justify-between border-b border-medBorder pb-3">
                    <div>
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        Episodic Patient Memory & Clinician Feedback Audit Trail
                        <span className="text-xs font-mono font-normal text-sky-400 px-2 py-0.5 rounded bg-sky-950 border border-sky-800">
                          Bed {selectedPid}
                        </span>
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Inspects clinician alert acknowledgments, resolutions, and temporal context injected into reasoning prompts.
                      </p>
                    </div>
                    <span className="text-[10px] font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded">
                      Episodes: {patientMemory?.count || 0}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                    {/* Injected Memory Context String */}
                    <div className="bg-slate-900/90 rounded-lg p-3 border border-slate-800">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">
                        Injected Memory Prompt Context:
                      </span>
                      <p className="text-xs font-mono text-slate-300 bg-medDark p-2.5 rounded border border-slate-800 whitespace-pre-wrap">
                        {patientMemory?.context_prompt || 'No prior alert or clinician feedback history for this patient.'}
                      </p>
                    </div>

                    {/* Historical Episode Cards */}
                    <div className="bg-slate-900/90 rounded-lg p-3 border border-slate-800 max-h-48 overflow-y-auto space-y-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">
                        Recorded Feedback Episodes:
                      </span>
                      {(patientMemory?.episodes && patientMemory.episodes.length > 0) ? (
                        patientMemory.episodes.map((ep, idx) => (
                          <div key={idx} className="p-2 rounded bg-medDark border border-slate-800 text-xs space-y-1">
                            <div className="flex justify-between font-mono text-[10px] text-slate-400">
                              <span>Action: <b className="text-sky-400">{ep.clinician_action || ep.action}</b></span>
                              <span>By: {ep.clinician_id || 'Clinician'}</span>
                            </div>
                            <div className="text-slate-300 text-[11px]">
                              {ep.resolution_notes || ep.reason || ep.summary || 'Alert acknowledged and evaluated.'}
                            </div>
                          </div>
                        ))
                      ) : (
                        <p className="text-xs text-slate-500 italic p-2">
                          No episodes recorded yet. Acknowledging or resolving an alert logs an episodic memory entry with clinician attribution.
                        </p>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* ================================================================= */}
          {/* 4. CLINICAL FOOTER                                                */}
          {/* ================================================================= */}
          <footer className="bg-medCard border-t border-medBorder px-6 py-3 text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2 mt-auto">
            <div>
              <span className="font-semibold text-slate-300">CareMatrix</span> — Intelligent ICU Monitoring & Decision-Support System
            </div>
            <div className="flex items-center space-x-4">
              <span>Supervisor: <b className="text-emerald-400">Active</b></span>
              <span>•</span>
              <span>Decision Support Only</span>
              <span>•</span>
              <span className="text-slate-500">v2.0 Clinical Intelligence</span>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
